<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="google-site-verification" content="XYgBxlZ62EP7iVoE2TXsejqsU4Grf7G7NcUN1UEwniU" />
    <title>Prism Pulse | Official Site</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #00f3ff;
            --accent: #bc13fe;
            --bg: #050510;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Orbitron', sans-serif;
            background-color: var(--bg);
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* Animated Background Grid */
        .grid-bg {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: 
                linear-gradient(rgba(5, 5, 16, 0.8), rgba(5, 5, 16, 0.5)),
                repeating-linear-gradient(0deg, transparent 0, transparent 1px, rgba(0, 243, 255, 0.05) 1px, rgba(0, 243, 255, 0.05) 2px),
                repeating-linear-gradient(90deg, transparent 0, transparent 39px, rgba(188, 19, 254, 0.05) 39px, rgba(188, 19, 254, 0.05) 40px);
            background-size: 100% 100%, 100% 40px, 40px 100%;
            z-index: -1;
            animation: moveGrid 20s linear infinite;
        }

        @keyframes moveGrid {
            from { background-position: 0 0; }
            to { background-position: 0 40px; }
        }

        .hero-container {
            background: rgba(10, 10, 26, 0.6);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(0, 243, 255, 0.3);
            border-radius: 32px;
            padding: 60px 40px;
            max-width: 600px;
            width: 90%;
            text-align: center;
            box-shadow: 0 0 50px rgba(0, 243, 255, 0.15);
            position: relative;
        }

        .hero-container::before {
            content: '';
            position: absolute;
            top: -2px; left: -2px; right: -2px; bottom: -2px;
            border-radius: 32px;
            background: linear-gradient(45deg, var(--primary), transparent, var(--accent));
            z-index: -1;
            opacity: 0.3;
        }

        h1 {
            font-size: 64px;
            font-weight: 900;
            margin: 0;
            letter-spacing: -2px;
            font-style: italic;
            text-shadow: 0 0 20px var(--primary);
            line-height: 1;
        }

        .subtitle {
            font-size: 18px;
            color: var(--accent);
            letter-spacing: 8px;
            text-transform: uppercase;
            margin-top: 10px;
            font-weight: 700;
            text-shadow: 0 0 10px var(--accent);
        }

        .description {
            margin-top: 40px;
            color: #8899aa;
            line-height: 1.6;
            font-size: 16px;
        }

        .links-grid {
            margin-top: 50px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .nav-link {
            text-decoration: none;
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 15px 20px;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 700;
            text-transform: uppercase;
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            background: rgba(255, 255, 255, 0.02);
        }

        .nav-link:hover {
            border-color: var(--primary);
            background: rgba(0, 243, 255, 0.1);
            box-shadow: 0 0 20px rgba(0, 243, 255, 0.3);
            transform: translateY(-3px);
        }

        .footer {
            margin-top: 40px;
            font-size: 12px;
            color: #445;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>
    <div class="grid-bg"></div>

    <div class="hero-container">
        <h1>PRISM PULSE</h1>
        <div class="subtitle">Pulse Network</div>
        
        <p class="description">
            Experience the next generation of block puzzles. High-stakes arcade modes, global leaderboards, and pure neon energy.
        </p>

        <div class="links-grid">
            <a href="privacy.html" class="nav-link">Privacy Policy</a>
            <a href="terms.html" class="nav-link">Terms of Service</a>
        </div>

        <div class="footer">
            &copy; 2026 PULSE NETWORK INTERFACE
        </div>
    </div>
</body>
</html>
